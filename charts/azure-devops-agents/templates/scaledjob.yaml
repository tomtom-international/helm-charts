{{- $defaultName := printf "%s" (include "azure-devops-agents.fullname" .) -}}
{{- $azpTokenSecret := ternary (.Values.externalSecret.secretName | default ($defaultName)) (.Values.secret.name | default ($defaultName)) .Values.externalSecret.create -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ include "azure-devops-agents.fullname" . }}
spec:
  jobTargetRef:
    template:
      metadata:
        {{- with .Values.podAnnotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.managedIdentity.enabled }}
        labels:
          azure.workload.identity/use: "true"
        {{- end }}
      spec:
        {{- if .Values.managedIdentity.enabled }}
        serviceAccountName: {{ .Values.managedIdentity.serviceAccountName }}
        {{- end }}
        restartPolicy: Never
        containers:
        - name: {{ include "azure-devops-agents.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ["/usr/local/bin/start.sh"]
          args: ["--once"]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: AZP_URL
            value: {{ .Values.agentPoolInfo.url }}
          - name: AZP_POOL
            value: {{ .Values.agentPoolInfo.poolname }}
          {{- if not .Values.managedIdentity.enabled }}
          - name: AZP_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ $azpTokenSecret }}
                key: AZP_TOKEN
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}  
          securityContext:
            privileged: {{ .Values.agentPoolInfo.privileged }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
          {{- toYaml .Values.volumeMounts | nindent 10 }}
        volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- with .Values.nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.imagePullSecrets }}
        imagePullSecrets:
        - name: {{ .name }}
        {{- end }}
  {{- toYaml .Values.autoscaling | nindent 2 }}
  scalingStrategy:
    strategy: "default"               
  triggers:
  - type: azure-pipelines
    metadata:
      poolID: "{{ .Values.agentPoolInfo.poolID }}"
      organizationURLFromEnv: "AZP_URL"
      {{- if not .Values.managedIdentity.enabled }}
      personalAccessTokenFromEnv: "AZP_TOKEN"
      {{- end }}
    {{- if .Values.managedIdentity.enabled }}
    authenticationRef:
      name: {{ .Values.managedIdentity.triggerAuthName }}
    {{- end }}